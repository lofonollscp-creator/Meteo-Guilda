<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Meteo Guilda · Previsión a partir de datos abiertos</title>
<meta name="description" content="Previsión meteorológica elaborada a partir de modelos numéricos abiertos y balizas meteorológicas APRS, con lectura de IA y datos crudos a la vista.">
<meta name="theme-color" content="#f4f3ef" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0c1115" media="(prefers-color-scheme: dark)">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preload" href="fonts/ibm-plex-sans-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/newsreader-latin-500-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="vendor/maplibre-gl.css">
<link rel="stylesheet" href="css/app.css">
<script>try{var t=localStorage.getItem('mg-theme');if(t)document.documentElement.dataset.theme=t}catch(e){}</script>
</head>
<body data-view="places">
<a class="skip" href="#detail">Saltar al contenido</a>

<div class="app">
  <aside class="rail" id="rail" aria-label="Lugares">
    <header class="brand">
      <div class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 28 28" width="28" height="28"><path d="M3 21 10.5 8l4.2 7.2L18 11l7 10z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><circle cx="21.5" cy="6.5" r="2" fill="currentColor"/></svg>
      </div>
      <div class="brand-text"><strong>Meteo Guilda</strong><span>Datos abiertos · balizas APRS · IA</span></div>
      <button class="icon-btn" id="theme" type="button" aria-label="Cambiar tema claro/oscuro">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
    </header>
    <div class="rail-label">Lugares</div>
    <ul class="places" id="places" role="list"></ul>
    <p class="rail-note">Resumen de modelos (media de 4). Pulsa un lugar para la lectura completa.</p>
  </aside>

  <main class="detail" id="detail" tabindex="-1" aria-live="polite"></main>

  <section class="mapcol" aria-label="Mapa">
    <div id="map"></div>
    <div class="map-ctl">
      <button type="button" id="fit" class="chip">Ver los 6 lugares</button>
      <span class="chip chip-ghost" id="maphint">Toca el mapa para consultar cualquier punto</span>
    </div>
  </section>

  <nav class="tabs" aria-label="Vistas">
    <button type="button" data-go="places"><svg viewBox="0 0 24 24"><path d="M12 21s7-6.2 7-11.5A7 7 0 0 0 5 9.5C5 14.8 12 21 12 21Z"/><circle cx="12" cy="9.5" r="2.5"/></svg><span>Lugares</span></button>
    <button type="button" data-go="forecast"><svg viewBox="0 0 24 24"><path d="M4 18h16M6 14l3-4 3 3 4-6 2 3"/></svg><span>Previsión</span></button>
    <button type="button" data-go="map"><svg viewBox="0 0 24 24"><path d="m9 4-5 2v14l5-2 6 2 5-2V4l-5 2-6-2Z"/><path d="M9 4v14M15 6v14"/></svg><span>Mapa</span></button>
  </nav>
</div>

<script src="vendor/maplibre-gl.js"></script>
<script type="module" src="js/app.js"></script>
</body>
</html>
