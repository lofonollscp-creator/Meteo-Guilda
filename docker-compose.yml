# Radio Guilda + Meteo Guilda. Pensado para un VPS compartido: nada expuesto salvo 127.0.0.1:${MG_HTTP_PORT},
# memoria acotada por servicio y un proxy inverso del host (nginx/Caddy) delante para el TLS.
services:
  db:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    mem_limit: 512m
    command: postgres -c shared_buffers=96MB -c effective_cache_size=256MB -c max_connections=30 -c work_mem=4MB -c maintenance_work_mem=48MB
    environment:
      POSTGRES_DB: meteoguilda
      POSTGRES_USER: mg
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?define POSTGRES_PASSWORD en .env}
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mg -d meteoguilda"]
      interval: 10s
      retries: 10
  web:
    image: caddy:2-alpine
    restart: unless-stopped
    mem_limit: 128m
    ports: ["127.0.0.1:${MG_HTTP_PORT:-8088}:80"]
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./web:/srv/web:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [api]
  api:
    build: .
    restart: unless-stopped
    mem_limit: 512m
    command: uvicorn meteoguilda.main:app --host 0.0.0.0 --port 8000 --proxy-headers --forwarded-allow-ips='*' --workers 1
    env_file: .env
    environment:
      MG_PREGEN: "1"
      MG_PUBLIC_URL: ${MG_PUBLIC_URL:-https://radio.guildawork.com}
      MG_REPEATERS_SYNC: "1"
      MG_DATABASE_URL: postgresql://mg:${POSTGRES_PASSWORD}@db:5432/meteoguilda
    depends_on:
      db: {condition: service_healthy}
    expose: ["8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u;u.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 30s
  aprs:
    build: .
    restart: unless-stopped
    mem_limit: 192m
    command: python -m meteoguilda.ingest
    env_file: .env
    environment:
      MG_DATABASE_URL: postgresql://mg:${POSTGRES_PASSWORD}@db:5432/meteoguilda
    depends_on:
      db: {condition: service_healthy}
  mcp:
    build: .
    restart: unless-stopped
    mem_limit: 192m
    command: python -m meteoguilda.mcp_server --http
    env_file: .env
    environment:
      MG_API: http://api:8000
      MG_PUBLIC_URL: ${MG_PUBLIC_URL:-https://radio.guildawork.com}
    expose: ["8001"]
    depends_on: [api]
volumes:
  pgdata:
  caddy_data:
  caddy_config:
