[project]
name = "meteoguilda"
version = "0.1.0"
description = "Meteo Guilda: previsión con datos abiertos + IA"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.110", "uvicorn>=0.29", "httpx>=0.27", "pydantic>=2.6", "psycopg[binary,pool]>=3.1", "defusedxml>=0.7", "mcp>=2.3,<3", "sgp4>=2.23", "cryptography>=42"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["meteoguilda"]

[tool.setuptools.package-data]
meteoguilda = ["sql/*.sql"]
