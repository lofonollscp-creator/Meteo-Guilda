# Proxy inverso del VPS (nginx) para radio.guildawork.com -> contenedor web en 127.0.0.1:8088.
# 1) Certificado:  sudo certbot certonly --nginx -d radio.guildawork.com
# 2) Copia este fichero a /etc/nginx/sites-available/, enlázalo en sites-enabled/ y: sudo nginx -t && sudo systemctl reload nginx
server {
    listen 80;
    server_name radio.guildawork.com;
    return 301 https://$host$request_uri;
}
server {
    listen 443 ssl http2;
    server_name radio.guildawork.com;
    ssl_certificate     /etc/letsencrypt/live/radio.guildawork.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/radio.guildawork.com/privkey.pem;
    add_header Strict-Transport-Security "max-age=31536000" always;
    client_max_body_size 4m;                      # importar ADIF/GPX

    location / {
        proxy_pass http://127.0.0.1:8088;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;   # límites por IP en la API
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;                   # cálculo de cobertura y rutas
        proxy_buffering off;                      # el MCP usa respuestas en flujo
    }
}
