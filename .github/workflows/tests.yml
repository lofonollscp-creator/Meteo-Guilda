name: tests
on:
  push:
  pull_request:
jobs:
  pytest:
    runs-on: ubuntu-latest
    services:
      db:
        image: postgis/postgis:16-3.4
        env: { POSTGRES_USER: mg, POSTGRES_PASSWORD: ci, POSTGRES_DB: meteoguilda }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U mg" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      MG_DATABASE_URL: postgresql://mg:ci@localhost:5432/meteoguilda
      MG_ADMIN_TOKEN: ci-admin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: backend/pyproject.toml }
      - run: pip install '.[dev]'
        working-directory: backend
      - run: python -m pytest -q tests
        working-directory: backend
  comprobaciones:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - name: Sintaxis de los módulos JS de la web
        run: for f in web/js/*.js web/sw.js; do node --input-type=module --check < "$f" || exit 1; done
      - name: Sintaxis de los scripts de shell
        run: for f in *.sh scripts/*.sh e2e/*.sh; do [ -f "$f" ] && bash -n "$f" || true; done
      - name: Versión del service worker al día
        run: python3 scripts/version_sw.py --check
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Interfaz en navegador (anchos, accesibilidad, sin conexión)
        run: ./e2e/correr.sh
